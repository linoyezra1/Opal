<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>תצוגה מקדימה — דף תשלום Opal / Cardcom</title>
  <style>
    :root {
      --border: #d1d5db;
      --text: #111827;
      --muted: #6b7280;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #fff;
      color: var(--text);
      direction: rtl;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .intro {
      font-size: 14px;
      color: #374151;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .field label.required::after {
      content: " *";
      color: var(--red);
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap input,
    .input-wrap select {
      width: 100%;
      padding: 11px 40px 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
    }
    .input-wrap input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .input-wrap.error input { border-color: var(--red); }
    .input-wrap.ok input { border-color: var(--green); }
    .status {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 700;
    }
    .status.err { color: var(--red); }
    .status.ok { color: var(--green); }
    .icon-r {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.45;
      font-size: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .full { grid-column: 1 / -1; }
    .footer-pay {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .trust {
      font-size: 12px;
      color: var(--muted);
    }
    .pay-btn {
      min-width: 200px;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--red);
    }
    @media (max-width: 560px) {
      .grid-2 { grid-template-columns: 1fr; }
      .footer-pay { flex-direction: column-reverse; align-items: stretch; }
      .pay-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="intro">
      תצוגה מקדימה של עיצוב Opal לדף Cardcom. בפועל הדביקי את
      <code>server/assets/cardcom/opal-low-profile.css</code> בממשק Cardcom.
    </p>

    <form novalidate>
      <div class="field full">
        <label class="required" for="card">מספר כרטיס אשראי</label>
        <div class="input-wrap error">
          <span class="icon-r">💳</span>
          <span class="status err" aria-hidden="true">✕</span>
          <input id="card" type="text" inputmode="numeric" placeholder="•••• •••• •••• ••••" dir="ltr" />
        </div>
        <p class="hint">שדה חובה</p>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="required" for="cvv">קוד CVV</label>
          <div class="input-wrap">
            <span class="icon-r">🔒</span>
            <input id="cvv" type="text" inputmode="numeric" maxlength="4" dir="ltr" />
          </div>
        </div>
        <div class="field">
          <label class="required" for="exp">תוקף כרטיס</label>
          <div class="input-wrap">
            <span class="icon-r">📅</span>
            <input id="exp" type="text" placeholder="MM / YY" dir="ltr" />
          </div>
        </div>
        <div class="field">
          <label class="required" for="phone">טלפון נייד</label>
          <div class="input-wrap ok">
            <span class="icon-r">📞</span>
            <span class="status ok">✓</span>
            <input id="phone" type="tel" value="0501234567" dir="ltr" />
          </div>
        </div>
        <div class="field">
          <label for="id">תעודת זהות</label>
          <div class="input-wrap">
            <input id="id" type="text" inputmode="numeric" dir="ltr" />
          </div>
        </div>
      </div>

      <div class="field full">
        <label class="required" for="name">שם מלא (בעל הכרטיס)</label>
        <div class="input-wrap ok">
          <span class="icon-r">👤</span>
          <span class="status ok">✓</span>
          <input id="name" type="text" value="ישראל ישראלי" />
        </div>
      </div>

      <div class="field full">
        <label class="required" for="email">דואר אלקטרוני</label>
        <div class="input-wrap">
          <span class="icon-r">✉</span>
          <input id="email" type="email" placeholder="name@example.com" dir="ltr" />
        </div>
      </div>

      <div class="footer-pay">
        <div class="trust">PCI · Verified by Visa · Mastercard SecureCode</div>
        <button type="button" class="pay-btn">לתשלום 10.00 ₪</button>
      </div>
    </form>
  </div>
</body>
</html>
